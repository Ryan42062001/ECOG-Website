name: Site Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run static validation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const topPages = ['index.html','new-here.html','about.html','ministries.html','messages.html','events.html','give.html','contact.html','404.html'];
          const ministryPages = ['ministries/children.html','ministries/students.html','ministries/men.html','ministries/women.html','ministries/senior-adults.html'];
          const pages = [...topPages, ...ministryPages];
          const required = [...pages,'assets/css/main.css','assets/css/components.css','assets/css/ministries.css','assets/js/components.js','assets/js/main.js','data/events.json','data/sermons.json','docs/phase-2-design-system.md','robots.txt'];
          const failures = [];
          const assert = (condition, message) => { if (!condition) failures.push(message); };
          const read = (file) => fs.readFileSync(path.join(root, file), 'utf8');

          for (const file of required) assert(fs.existsSync(path.join(root,file)), `Missing required file: ${file}`);
          for (const file of pages.filter((p) => p !== '404.html')) {
            const html = read(file); const prefix = file.startsWith('ministries/') ? '../' : '';
            assert(/<html\s+lang="en"/i.test(html), `${file}: missing lang=en`);
            assert(/<meta\s+name="viewport"/i.test(html), `${file}: missing viewport meta`);
            assert(/<title>[^<]+<\/title>/i.test(html), `${file}: missing title`);
            assert(/<main\s+id="main-content"/i.test(html), `${file}: missing #main-content`);
            assert(/class="skip-link"\s+href="#main-content"/i.test(html), `${file}: missing skip link`);
            assert(html.includes(`${prefix}assets/css/main.css`), `${file}: incorrect main.css path`);
            assert(html.includes(`${prefix}assets/js/components.js`), `${file}: incorrect components.js path`);
            assert(html.includes(`${prefix}assets/js/main.js`), `${file}: incorrect main.js path`);
            assert(html.includes('data-site-header'), `${file}: missing shared header target`);
            assert(html.includes('data-site-footer'), `${file}: missing shared footer target`);
          }

          const home = read('index.html');
          assert(home.includes('assets/css/components.css'),'Homepage: component stylesheet missing');
          for (const marker of ['class="hero section-dark"','class="service-strip"','home-welcome','home-ministry-grid','home-message-section','home-events-section','home-location-section','home-final-cta']) assert(home.includes(marker),`Homepage: missing ${marker}`);
          assert(home.includes('11152 Lincoln Highway'),'Homepage: verified street address missing');
          assert(home.includes('Everett, PA 15537'),'Homepage: verified city/state/ZIP missing');
          assert(home.includes('Sunday Worship</span><strong>9:30 AM'),'Homepage: Sunday service time missing');
          assert(home.includes('Wednesday Bible Study</span><strong>7:00 PM'),'Homepage: Wednesday service time missing');
          assert(!/sermon title|event title/i.test(home),'Homepage: unverified placeholder content detected');

          const visit = read('new-here.html');
          assert(visit.includes('assets/css/components.css'),'New Here: component stylesheet missing');
          for (const marker of ['class="page-hero visit-hero"','id="visit-details"','visit-quick__grid','visit-expect','visit-steps','visit-kids','visit-preview','visit-faq','id="location"','visit-final']) assert(visit.includes(marker),`New Here: missing ${marker}`);
          assert(visit.includes('Sunday Worship</span><strong>9:30 AM'),'New Here: verified Sunday service time missing');
          assert(visit.includes('Wednesday Bible Study</span><strong>7:00 PM'),'New Here: verified Wednesday service time missing');
          assert(visit.includes('11152 Lincoln Highway'),'New Here: verified street address missing');
          assert(visit.includes('Everett, PA 15537'),'New Here: verified city/state/ZIP missing');
          assert(visit.includes('ministries/children.html'),'New Here: Children\'s Ministry link missing');
          assert(visit.includes('messages.html'),'New Here: Messages link missing');
          assert(visit.includes('contact.html'),'New Here: Contact link missing');
          assert(visit.includes('google.com/maps/search/?api=1'),'New Here: directions link missing');
          assert(!/parking (lot|entrance)|check[- ]?in desk|nursery|childcare|dress code|service lasts|service length/i.test(visit),'New Here: unverified visitor logistics detected');

          const about = read('about.html');
          assert(about.includes('assets/css/components.css'),'About: component stylesheet missing');
          for (const marker of ['class="page-hero about-hero"','id="our-heart"','about-value-grid','about-leadership','about-leader-placeholder','about-beliefs','about-next']) assert(about.includes(marker),`About: missing ${marker}`);
          assert(about.includes('A church family centered on Jesus.'),'About: hero message missing');
          assert(about.includes('Loving God. Loving People.'),'About: church-heart message missing');
          assert(about.includes('Pentecostal church'),'About: verified Pentecostal identity missing');
          assert(!/Faith · Worship · Community/.test(about),'About: unverified belief-summary formulation detected');
          assert(!/intentionally holding|church confirms|doctrinal wording is verified/i.test(about),'About: internal editorial/process copy detected');
          assert(!/senior pastor|lead pastor|founded in|established in/i.test(about),'About: potentially unverified leadership/history claim detected');

          const hub = read('ministries.html');
          assert(hub.includes('assets/css/ministries.css'),'Ministries: Phase 6 stylesheet missing');
          for (const marker of ['ministry-hub-hero','id="ministry-groups"','ministry-grid','ministry-card']) assert(hub.includes(marker),`Ministries: missing ${marker}`);
          for (const page of ministryPages) assert(hub.includes(page),`Ministries: link missing for ${page}`);
          for (const label of ['Children','Amplify Students','Guys Ministry','Women\'s Discipleship','Senior Adults']) assert(hub.includes(label),`Ministries: missing ${label}`);
          assert(hub.includes('Ages 5–12'),'Ministries: verified Children age range missing');
          assert(hub.includes('Ages 12–college age'),'Ministries: verified Amplify age range missing');
          assert(hub.includes('Ages 55+'),'Ministries: verified Senior Adults age range missing');

          for (const file of ministryPages) {
            const html = read(file);
            assert(html.includes('../assets/css/ministries.css'),`${file}: Phase 6 stylesheet missing`);
            assert(html.includes('class="page-hero ministry-hero"'),`${file}: ministry hero missing`);
            assert(html.includes('../ministries.html'),`${file}: all-ministries return link missing`);
            assert(html.includes('../contact.html') || html.includes('../new-here.html'),`${file}: visitor/contact next step missing`);
            assert(!/coming soon|details will be added|leader(s)?\s*:/i.test(html),`${file}: stale placeholder/editorial ministry copy detected`);
          }
          const children = read('ministries/children.html');
          assert(children.includes('5–12'),'Children: verified age range missing');
          assert(children.includes('Sunday · 9:30 AM'),'Children: verified Sunday time missing');
          const students = read('ministries/students.html');
          assert(students.includes('12–College Age'),'Amplify: verified age range missing');
          assert(students.includes('<strong>9:30 AM</strong>'),'Amplify: verified Sunday time missing');
          assert(students.includes('<strong>7:00 PM</strong>'),'Amplify: verified Wednesday time missing');
          const seniors = read('ministries/senior-adults.html');
          assert(seniors.includes('Adults 55+'),'Senior Adults: verified age range missing');
          assert(seniors.includes('Senior Adults Living Triumphantly'),'Senior Adults: ministry name missing');
          assert(/has included seasonal meals, trips, fellowship, and service projects/i.test(seniors),'Senior Adults: historical activity wording missing');

          const mainCss = read('assets/css/main.css'); const componentCss = read('assets/css/components.css'); const ministryCss = read('assets/css/ministries.css');
          assert(mainCss.includes('--color-accent:#00c8ef'),'Design system: ECOG cyan accent token missing');
          assert(mainCss.includes(':focus-visible'),'Design system: focus-visible treatment missing');
          assert(mainCss.includes('prefers-reduced-motion:reduce'),'Design system: reduced-motion treatment missing');
          for (const marker of ['.cta-panel','.info-tile','.location-card','.home-empty-state','.visit-hero','.visit-quick','.visit-steps','.visit-faq','.visit-final','.about-hero','.about-value-grid','.about-leader-placeholder','.about-beliefs']) assert(componentCss.includes(marker),`Component system: missing ${marker}`);
          for (const marker of ['.ministry-hub-hero','.ministry-grid','.ministry-card','.ministry-hero','.ministry-quick','.ministry-photo','.ministry-next']) assert(ministryCss.includes(marker),`Phase 6 CSS: missing ${marker}`);
          assert(ministryCss.includes('@media(max-width:860px)'),'Phase 6 CSS: tablet/mobile breakpoint missing');
          assert(ministryCss.includes('@media(max-width:620px)'),'Phase 6 CSS: small-screen breakpoint missing');
          assert(ministryCss.includes('.ministry-grid{grid-template-columns:1fr}'),'Phase 6 CSS: ministry card stacking missing');
          assert(ministryCss.includes('.ministry-quick__grid{grid-template-columns:1fr}'),'Phase 6 CSS: quick-info stacking missing');

          const components = read('assets/js/components.js'); const mainJs = read('assets/js/main.js');
          assert(components.includes("path.includes('/ministries/') ? '../' : ''"),'Shared components: nested ministry depth handling missing');
          assert(components.includes('aria-current="page"'),'Shared components: current-page accessibility state missing');
          assert(components.includes('brand__cross'),'Shared components: ECOG mark treatment missing');
          assert(components.includes('new Date().getFullYear()'),'Shared footer: dynamic current year missing');
          assert(mainJs.includes("event.key === 'Escape'"),'Navigation: Escape-key close behavior missing');
          assert(mainJs.includes('window.innerWidth > 860'),'Navigation: desktop reset behavior missing');

          for (const dataFile of ['data/events.json','data/sermons.json']) {
            let data; try { data = JSON.parse(read(dataFile)); } catch (error) { failures.push(`${dataFile}: invalid JSON (${error.message})`); continue; }
            assert(Array.isArray(data),`${dataFile}: root must be an array`); assert(Array.isArray(data) && data.length === 0,`${dataFile}: must remain empty until verified content is added`);
          }
          const robots = read('robots.txt');
          assert(/User-agent:\s*\*/i.test(robots),'robots.txt: missing wildcard user-agent'); assert(/Disallow:\s*\//i.test(robots),'robots.txt: staging crawl block missing'); assert(!fs.existsSync(path.join(root,'CNAME')),'Production CNAME must not exist before launch');
          const notFound = read('404.html');
          assert(/name="robots"\s+content="noindex"/i.test(notFound),'404.html: missing noindex'); assert(notFound.includes("location.hostname.endsWith('github.io')"),'404.html: GitHub Pages project-root handling missing');

          if (failures.length) { console.error(`Site validation failed with ${failures.length} issue(s):`); failures.forEach((failure) => console.error(`- ${failure}`)); process.exit(1); }
          console.log(`Site validation passed: ${pages.length} pages, ${required.length} required files, and Phase 3/4/5/6 safeguards checked.`);
          NODE

      - name: Syntax-check JavaScript
        run: |
          node --check assets/js/components.js
          node --check assets/js/main.js
