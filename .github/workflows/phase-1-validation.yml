name: Site Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run static validation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const topPages = ['index.html','new-here.html','about.html','ministries.html','messages.html','events.html','give.html','contact.html','404.html'];
          const activeMinistryPages = ['ministries/children.html','ministries/students.html','ministries/men.html','ministries/women.html'];
          const retiredMinistryPages = ['ministries/senior-adults.html'];
          const ministryPages = [...activeMinistryPages, ...retiredMinistryPages];
          const pages = [...topPages, ...ministryPages];
          const required = [...pages,'assets/css/main.css','assets/css/components.css','assets/css/ministries.css','assets/css/messages.css','assets/css/events.css','assets/css/giving-contact.css','assets/js/components.js','assets/js/main.js','assets/js/messages.js','assets/js/events.js','data/events.json','data/sermons.json','docs/phase-2-design-system.md','docs/phase-10-content-migration.md','robots.txt'];
          const failures = [];
          const assert = (condition, message) => { if (!condition) failures.push(message); };
          const read = (file) => fs.readFileSync(path.join(root, file), 'utf8');

          for (const file of required) assert(fs.existsSync(path.join(root,file)), `Missing required file: ${file}`);
          for (const file of pages.filter((p) => p !== '404.html')) {
            const html = read(file); const prefix = file.startsWith('ministries/') ? '../' : '';
            assert(/<html\s+lang="en"/i.test(html), `${file}: missing lang=en`);
            assert(/<meta\s+name="viewport"/i.test(html), `${file}: missing viewport meta`);
            assert(/<title>[^<]+<\/title>/i.test(html), `${file}: missing title`);
            assert(/<main\s+id="main-content"/i.test(html), `${file}: missing #main-content`);
            assert(/class="skip-link"\s+href="#main-content"/i.test(html), `${file}: missing skip link`);
            assert(html.includes(`${prefix}assets/css/main.css`), `${file}: incorrect main.css path`);
            assert(html.includes(`${prefix}assets/js/components.js`), `${file}: incorrect components.js path`);
            assert(html.includes(`${prefix}assets/js/main.js`), `${file}: incorrect main.js path`);
            assert(html.includes('data-site-header'), `${file}: missing shared header target`);
            assert(html.includes('data-site-footer'), `${file}: missing shared footer target`);
          }

          const home = read('index.html');
          for (const marker of ['class="hero section-dark"','class="service-strip"','home-welcome','home-ministry-grid','home-message-section','home-events-section','home-location-section','home-final-cta','data-home-events','data-home-event-list']) assert(home.includes(marker),`Homepage: missing ${marker}`);
          assert(home.includes('11152 Lincoln Highway') && home.includes('Everett, PA 15537'),'Homepage: verified address missing');
          assert(home.includes('Sunday Worship</span><strong>10:00 AM') && home.includes('Wednesday Bible Study</span><strong>7:00 PM'),'Homepage: current service times missing');
          assert(!home.includes('9:30 AM'),'Homepage: obsolete Sunday 9:30 AM time detected');
          assert(!/senior adults/i.test(home),'Homepage: inactive Senior Adults ministry must not be promoted');
          assert(!/sermon title|event title/i.test(home),'Homepage: unverified placeholder content detected');

          const visit = read('new-here.html');
          for (const marker of ['class="page-hero visit-hero"','id="visit-details"','visit-quick__grid','visit-expect','visit-steps','visit-kids','visit-preview','visit-faq','id="location"','visit-final']) assert(visit.includes(marker),`New Here: missing ${marker}`);
          assert(visit.includes('11152 Lincoln Highway') && visit.includes('Everett, PA 15537'),'New Here: verified address missing');
          assert(visit.includes('Sunday Worship</span><strong>10:00 AM') && visit.includes('Wednesday Bible Study</span><strong>7:00 PM'),'New Here: current service times missing');
          assert(!visit.includes('9:30 AM'),'New Here: obsolete Sunday 9:30 AM time detected');
          assert(visit.includes('google.com/maps/search/?api=1'),'New Here: directions link missing');
          assert(!/parking (lot|entrance)|check[- ]?in desk|nursery|childcare|dress code|service lasts|service length/i.test(visit),'New Here: unverified visitor logistics detected');

          const about = read('about.html');
          for (const marker of ['class="page-hero about-hero"','id="our-heart"','about-value-grid','about-leadership','about-leader-placeholder','about-beliefs','about-next']) assert(about.includes(marker),`About: missing ${marker}`);
          assert(about.includes('A church family centered on Jesus.') && about.includes('Loving God. Loving People.') && about.includes('Pentecostal church'),'About: verified identity copy missing');
          assert(about.includes('Jenn &amp; John Kisner') && about.includes('Co-Pastors'),'About: confirmed co-pastor information missing');
          for (const belief of ['The Bible','God','Jesus Christ','Salvation','The Holy Spirit','The Church','Jesus Is Coming Back']) assert(about.includes(belief),`About: confirmed belief section missing ${belief}`);
          assert(!about.includes('9:30 AM'),'About: obsolete Sunday 9:30 AM time detected');
          assert(!/senior pastor|lead pastor|founded in|established in/i.test(about),'About: potentially unverified leadership/history claim detected');

          const hub = read('ministries.html');
          for (const marker of ['assets/css/ministries.css','ministries-hero','id="ministry-groups"','ministries-grid','ministry-card']) assert(hub.includes(marker),`Ministries: missing ${marker}`);
          for (const page of activeMinistryPages) assert(hub.includes(page),`Ministries: active ministry link missing for ${page}`);
          assert(!hub.includes('ministries/senior-adults.html') && !/Ages 55\+|Senior Adults/i.test(hub),'Ministries: inactive Senior Adults ministry must not be listed as active');
          assert(hub.includes('Ages 5–12') && hub.includes('Ages 12–college age'),'Ministries: current age ranges missing');
          for (const file of activeMinistryPages) {
            const html = read(file);
            assert(html.includes('../assets/css/ministries.css'),`${file}: Phase 6 stylesheet missing`);
            assert(html.includes('class="page-hero ministry-hero"'),`${file}: ministry hero missing`);
            assert(!/coming soon|details will be added|leader(s)?\s*:/i.test(html),`${file}: stale placeholder/editorial ministry copy detected`);
          }
          const children = read('ministries/children.html');
          assert(children.includes('Ages 5–12') && children.includes('Sunday · 10:00 AM'),'Children: confirmed age/time missing');
          assert(!children.includes('9:30 AM'),'Children: obsolete Sunday time detected');
          const students = read('ministries/students.html');
          assert(students.includes('Wednesday · 7:00 PM') && students.includes('Students gather Wednesday evenings at 7:00 PM.'),'Amplify: confirmed Wednesday schedule missing');
          assert(!/Sunday[^<.]*9:30|Sunday[^<.]*10:00/i.test(students),'Amplify: obsolete Sunday meeting detected');
          const men = read('ministries/men.html');
          assert(men.includes('no fixed weekly or monthly meeting schedule'),'Guys: event-based schedule statement missing');
          const women = read('ministries/women.html');
          assert(women.includes('no fixed monthly meeting schedule'),'Women: event-based schedule statement missing');
          assert(!/last Tuesday|most months/i.test(women),'Women: obsolete monthly schedule detected');
          const retired = read('ministries/senior-adults.html');
          assert(/name="robots"\s+content="noindex,follow"/i.test(retired),'Senior Adults legacy page: noindex,follow missing');
          assert(retired.includes('no longer active') && retired.includes('../ministries.html'),'Senior Adults legacy page: retirement notice/current-ministry link missing');
          assert(!/Bob|Shirley|Ages 55\+/i.test(retired),'Senior Adults legacy page: stale historical contact/age content detected');

          const messages = read('messages.html');
          for (const marker of ['assets/css/messages.css','assets/js/messages.js','data-messages-app','class="page-hero messages-hero"','data-featured-message','id="message-library"','data-message-count','data-message-library','messages-next']) assert(messages.includes(marker),`Messages: missing ${marker}`);
          assert(!/sermon title|speaker name|message title/i.test(messages),'Messages: unverified sermon placeholder content detected');

          const events = read('events.html');
          for (const marker of ['assets/css/events.css','assets/js/events.js','data-events-app','class="page-hero events-hero"','data-featured-event','id="event-calendar"','data-event-count','data-event-library','events-next']) assert(events.includes(marker),`Events: missing ${marker}`);
          assert(events.includes('Sunday worship at 10:00 AM') && events.includes('Wednesday Bible Study at 7:00 PM'),'Events: current service times missing');
          assert(!events.includes('9:30 AM'),'Events: obsolete Sunday time detected');
          assert(!/event title|event date|event location/i.test(events),'Events: unverified event placeholder content detected');

          const give = read('give.html');
          assert(give.includes('assets/css/giving-contact.css'),'Give: Phase 9 stylesheet missing');
          for (const marker of ['class="page-hero give-hero"','give-intro','give-status','give-options','give-safety','contact-next']) assert(give.includes(marker),`Give: missing ${marker}`);
          assert(give.includes('tel:+18146529287'),'Give: verified church phone link missing');
          assert(give.includes('will not collect or store your card, bank account, or other payment information'),'Give: payment-data safety statement missing');
          assert(give.includes('verified external giving provider'),'Give: external-provider safety language missing');
          assert(!/<form\b|<input\b|<iframe\b/i.test(give),'Give: payment/form collection surface must not be embedded');
          assert(!/href="https?:\/\/(?!www\.google\.com\/maps)/i.test(give),'Give: unverified external giving/payment link detected');

          const contact = read('contact.html');
          assert(contact.includes('assets/css/giving-contact.css'),'Contact: Phase 9 stylesheet missing');
          for (const marker of ['class="page-hero contact-hero"','contact-grid','contact-list','contact-map','contact-help-grid','contact-next']) assert(contact.includes(marker),`Contact: missing ${marker}`);
          assert(contact.includes('11152 Lincoln Highway') && contact.includes('Everett, PA 15537'),'Contact: verified address missing');
          assert(contact.includes('tel:+18146529287') && contact.includes('814-652-9287'),'Contact: verified phone missing');
          assert(contact.includes('Sunday Worship') && contact.includes('10:00 AM') && contact.includes('Wednesday Bible Study') && contact.includes('7:00 PM'),'Contact: current service times missing');
          assert(!contact.includes('9:30 AM'),'Contact: obsolete Sunday time detected');
          for (const email of ['mailto:everettcog@comcast.net','mailto:kisner.jenn@yahoo.com','mailto:jdkcog@comcast.net']) assert(contact.includes(email),`Contact: confirmed email missing: ${email}`);
          assert(contact.includes('Jenn Kisner') && contact.includes('John Kisner') && contact.includes('Co-Pastor'),'Contact: confirmed pastoral contacts missing');
          assert(contact.includes('https://www.google.com/maps/search/?api=1'),'Contact: Google Maps directions link missing');
          assert(/target="_blank"\s+rel="noopener noreferrer"/.test(contact),'Contact: external directions link protection missing');
          assert(!/<form\b|<input\b|<textarea\b/i.test(contact),'Contact: unapproved static contact form detected');

          const mainCss = read('assets/css/main.css');
          const componentCss = read('assets/css/components.css');
          const ministryCss = read('assets/css/ministries.css');
          const messagesCss = read('assets/css/messages.css');
          const eventsCss = read('assets/css/events.css');
          const phase9Css = read('assets/css/giving-contact.css');
          assert(mainCss.includes('--color-accent:#00c8ef'),'Design system: ECOG cyan accent token missing');
          assert(mainCss.includes(':focus-visible'),'Design system: focus-visible treatment missing');
          assert(mainCss.includes('prefers-reduced-motion:reduce'),'Design system: reduced-motion treatment missing');
          for (const marker of ['.cta-panel','.info-tile','.location-card','.home-empty-state','.visit-hero','.visit-faq','.about-hero','.about-beliefs']) assert(componentCss.includes(marker),`Component system: missing ${marker}`);
          assert(ministryCss.includes('@media(max-width:620px)') && ministryCss.includes('.ministries-grid{grid-template-columns:1fr}'),'Phase 6 CSS: mobile safeguards missing');
          assert(messagesCss.includes('@media(max-width:620px)') && messagesCss.includes('.messages-grid{grid-template-columns:1fr}'),'Phase 7 CSS: mobile safeguards missing');
          assert(eventsCss.includes('@media(max-width:620px)'),'Phase 8 CSS: mobile breakpoint missing');
          for (const marker of ['.give-hero','.give-intro__grid','.give-status','.give-options','.give-safety','.contact-hero','.contact-grid','.contact-list','.contact-map','.contact-help-grid','.contact-next']) assert(phase9Css.includes(marker),`Phase 9 CSS: missing ${marker}`);
          assert(phase9Css.includes('@media(max-width:900px)') && phase9Css.includes('@media(max-width:620px)'),'Phase 9 CSS: responsive breakpoints missing');

          const components = read('assets/js/components.js');
          const mainJs = read('assets/js/main.js');
          const messagesJs = read('assets/js/messages.js');
          const eventsJs = read('assets/js/events.js');
          assert(components.includes("path.includes('/ministries/') ? '../' : ''"),'Shared components: nested ministry depth handling missing');
          assert(components.includes('aria-current="page"'),'Shared components: current-page accessibility state missing');
          assert(components.includes('new Date().getFullYear()'),'Shared footer: dynamic current year missing');
          assert(components.includes('Sunday Worship · 10:00 AM') && components.includes('Wednesday Bible Study · 7:00 PM'),'Shared footer: current service times missing');
          assert(!components.includes('9:30 AM'),'Shared footer: obsolete Sunday time detected');
          for (const value of ['mailto:everettcog@comcast.net','https://www.facebook.com/EverettCOG/','https://www.youtube.com/@everettchurchofgod417']) assert(components.includes(value),`Shared footer: confirmed contact/social link missing: ${value}`);
          assert(mainJs.includes("event.key === 'Escape'") && mainJs.includes('window.innerWidth > 860'),'Navigation: keyboard/desktop reset safeguards missing');
          assert(messagesJs.includes('escapeHtml') && messagesJs.includes("['http:', 'https:'].includes(url.protocol)") && messagesJs.includes('rel=\"noopener noreferrer\"') && messagesJs.includes('Array.isArray(data)') && messagesJs.includes('.catch(renderError)'),'Messages renderer: safety/error safeguards missing');
          assert(messagesJs.includes('https://www.youtube.com/@everettchurchofgod417') && messagesJs.includes('Watch ECOG on YouTube.'),'Messages renderer: official YouTube fallback missing');
          assert(eventsJs.includes('escapeHtml') && eventsJs.includes("['http:', 'https:'].includes(url.protocol)") && eventsJs.includes('rel=\"noopener noreferrer\"') && eventsJs.includes('Array.isArray(data)') && eventsJs.includes('date >= today') && eventsJs.includes('events.slice(0, 3)') && eventsJs.includes('.catch(renderError)'),'Events renderer: safety/filter safeguards missing');

          for (const [file, label] of [['data/events.json','events'],['data/sermons.json','sermons']]) {
            let data;
            try { data = JSON.parse(read(file)); } catch (error) { failures.push(`${file}: invalid JSON (${error.message})`); continue; }
            assert(Array.isArray(data),`${file}: root must be an array`);
            if (!Array.isArray(data)) continue;
            for (const [index,item] of data.entries()) {
              assert(item && typeof item === 'object' && !Array.isArray(item),`${file}[${index}]: must be an object`);
              if (!item || typeof item !== 'object' || Array.isArray(item)) continue;
              if (label === 'events') {
                assert(typeof item.title === 'string' && item.title.trim(),`${file}[${index}]: title is required`);
                assert(typeof item.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(item.date),`${file}[${index}]: date must use YYYY-MM-DD`);
              } else assert(typeof item.title === 'string' && item.title.trim(),`${file}[${index}]: title is required`);
              const urlKey = label === 'events' ? 'detailsUrl' : 'watchUrl';
              if (urlKey in item) { try { const url = new URL(item[urlKey]); assert(['http:','https:'].includes(url.protocol),`${file}[${index}]: ${urlKey} must use HTTP/HTTPS`); } catch { failures.push(`${file}[${index}]: ${urlKey} must be a valid absolute URL`); } }
            }
          }

          const migration = read('docs/phase-10-content-migration.md');
          for (const marker of ['10:00 AM','everettcog@comcast.net','Jenn Kisner','John Kisner','kisner.jenn@yahoo.com','jdkcog@comcast.net','https://www.facebook.com/EverettCOG/','https://www.youtube.com/@everettchurchofgod417']) assert(migration.includes(marker),`Phase 10 inventory: confirmed content missing: ${marker}`);
          assert(/Senior Adults[\s\S]{0,400}(inactive|no longer active)/i.test(migration),'Phase 10 inventory: Senior Adults retirement not documented');
          assert(/giving[\s\S]{0,500}(not yet selected|no current online giving|provider)/i.test(migration),'Phase 10 inventory: giving-provider dependency not documented');

          const robots = read('robots.txt');
          assert(/User-agent:\s*\*/i.test(robots),'robots.txt: missing wildcard user-agent');
          assert(/Disallow:\s*\//i.test(robots),'robots.txt: staging crawl block missing');
          assert(!fs.existsSync(path.join(root,'CNAME')),'Production CNAME must not exist before launch');
          const notFound = read('404.html');
          assert(/name="robots"\s+content="noindex"/i.test(notFound),'404.html: missing noindex');
          assert(notFound.includes("location.hostname.endsWith('github.io')"),'404.html: GitHub Pages project-root handling missing');

          if (failures.length) {
            console.error(`Site validation failed with ${failures.length} issue(s):`);
            failures.forEach((failure) => console.error(`- ${failure}`));
            process.exit(1);
          }
          console.log(`Site validation passed: ${pages.length} pages, ${required.length} required files, and Phase 3-10 safeguards checked.`);
          NODE

      - name: Syntax-check JavaScript
        run: |
          node --check assets/js/components.js
          node --check assets/js/main.js
          node --check assets/js/messages.js
          node --check assets/js/events.js
